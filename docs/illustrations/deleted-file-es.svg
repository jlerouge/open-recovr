<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 426" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Qué pasa con un archivo eliminado: 1. En la papelera, lo encuentra la búsqueda rápida. 2. Papelera vaciada, su nombre sigue en el índice del disco, lo encuentra la búsqueda profunda. 3. Índice reutilizado, los trozos siguen en el disco, los encuentra la búsqueda profunda gracias a PhotoRec. 4. Sobrescrito por un archivo nuevo, demasiado tarde.</title>
