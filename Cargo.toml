[package]
name = "open-recovr"
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
description = "Get your deleted files back, simply: one screen, PhotoRec underneath."
license = "MIT"
repository = "https://github.com/jlerouge/open-recovr"
readme = "README.md"
keywords = ["recovery", "undelete", "photorec", "data-recovery", "gui"]
categories = ["filesystem"]
publish = false

[build-dependencies]
resvg = { version = "0.49", default-features = false }
winresource = "0.1"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }
rfd = { version = "0.17.2", default-features = false }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
resvg = { version = "0.49", default-features = false }
sha2 = "0.10"
minisign-verify = "0.3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Media", "Win32_Media_Multimedia", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux desktops: both window systems, and the desktop's own file picker.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level = 3
# a smaller program to download
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
# style choices of this code base, kept on purpose
enum_variant_names = "allow"
manual_checked_ops = "allow"
type_complexity = "allow"
while_let_loop = "allow"

[dev-dependencies]
minisign = "0.10.0"
