<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Open Recovr: a hard drive under a magnifying glass -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFA"/>
      <stop offset="1" stop-color="#3B2CC4"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9DEF4"/>
    </linearGradient>
    <radialGradient id="platter" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#D3D8F0"/>
      <stop offset="1" stop-color="#959FD4"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDBA4D"/>
      <stop offset="1" stop-color="#DC7409"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#C7D2FE" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>

  <!-- the drive -->
  <rect x="40" y="40" width="136" height="172" rx="18" fill="#1E1670" opacity="0.35"/>
  <rect x="40" y="34" width="136" height="172" rx="18" fill="url(#case)"/>
  <circle cx="54" cy="48" r="4" fill="#C3C9E8"/>
  <circle cx="162" cy="48" r="4" fill="#C3C9E8"/>
  <circle cx="106" cy="102" r="47" fill="url(#platter)" stroke="#B4BBE4" stroke-width="2"/>
  <circle cx="106" cy="102" r="31" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5"/>
  <circle cx="106" cy="102" r="11" fill="#4F46E5"/>
  <circle cx="106" cy="102" r="4" fill="#E0E7FF"/>
  <path d="M158 58 L122 96" stroke="#3B3486" stroke-width="8" stroke-linecap="round"/>
  <circle cx="158" cy="58" r="10" fill="#3B3486"/>
  <circle cx="158" cy="58" r="4" fill="#A5B4FC"/>
  <rect x="72" y="176" width="40" height="8" rx="4" fill="#C3C9E8"/>
  <circle cx="58" cy="180" r="6" fill="#22C55E"/>

  <!-- the magnifying glass -->
  <path d="M199 199 L222 222" stroke="#1E1670" stroke-opacity="0.35" stroke-width="24" stroke-linecap="round" transform="translate(2 4)"/>
  <path d="M199 199 L222 222" stroke="url(#handle)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="168" cy="172" r="49" fill="#1E1670" opacity="0.3"/>
  <circle cx="166" cy="166" r="42" fill="url(#lens)"/>
  <circle cx="166" cy="166" r="42" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <circle cx="166" cy="166" r="48.5" fill="none" stroke="#312E81" stroke-width="2.5"/>
  <path d="M141 152 A28 28 0 0 1 158 138" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>
